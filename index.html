<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Lua Obfuscator</title>
    <link rel="stylesheet" href="style.css">
    <!-- Cargamos Monaco Editor (VS Code en la web) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.39.0/min/vs/loader.min.js"></script>
</head>
<body>
    <!-- Fondo animado -->
    <div class="bg-animation"></div>

    <nav class="navbar">
        <div class="logo">
            <span class="neon-text">NEO</span> Lua Obfuscator
        </div>
        <div class="user-badge">Guest User</div>
    </nav>

    <main class="container">
        <div class="header-content">
            <h1 class="title">Protege tu Código</h1>
            <p class="subtitle">Ofuscación avanzada con encriptación de strings y control de flujo.</p>
        </div>

        <div class="workspace">
            <!-- Panel de Entrada -->
            <div class="glass-panel">
                <div class="panel-header">
                    <h3>📄 Script Original (Lua)</h3>
                </div>
                <div id="inputEditor" class="editor"></div>
            </div>

            <!-- Controles -->
            <div class="controls">
                <select id="obfuscationLevel" class="custom-select">
                    <option value="1">Nivel 1: Rápido (Renombrar Variables)</option>
                    <option value="2" selected>Nivel 2: Fuerte (Strings Encriptados)</option>
                    <option value="3">Nivel 3: Máximo (Flujo de Control + Strings)</option>
                </select>
                <button id="obfuscateBtn" class="btn-neon">
                    <span class="btn-text">⚡ Ofuscar Código</span>
                </button>
            </div>

            <!-- Panel de Salida -->
            <div class="glass-panel">
                <div class="panel-header">
                    <h3>🛡️ Código Protegido</h3>
                    <button id="copyBtn" class="btn-icon" title="Copiar">📋</button>
                </div>
                <div id="outputEditor" class="editor"></div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="engine.js"></script>
    <script src="app.js"></script>
</body>
</html>
